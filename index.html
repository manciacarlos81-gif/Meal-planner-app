<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mealwise — budget meal planner</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥘</text></svg>">
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">Meal<span>wise</span></div>

    <nav class="nav" id="nav"></nav>

  <main id="view"></main>

<div id="modal-root"></div>

<!--
  Plain classic scripts, loaded in dependency order. Deliberately no ES modules,
  no bundler and no fetch() for data: that keeps the whole app working when you
  simply double-click this file (file://), on a machine with no Node installed.
-->
<script src="js/units.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/proteins.js"></script>
<script src="js/pricing.js"></script>
<script src="js/planner.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/shop.js"></script>
<script src="js/views/recipes.js"></script>
<script src="js/views/pantry.js"></script>
<script src="js/views/value.js"></script>
<script src="js/views/cook.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
